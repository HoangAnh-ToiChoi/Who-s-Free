# Sao lưu DB Supabase mỗi ngày (pg_dump), lưu thành artifact của GitHub Actions trong 14 ngày.
# Cần secret của repo:
#   SUPABASE_DB_URL    chuỗi kết nối "Session pooler" (cổng 5432) trong Supabase → Connect. Không dùng cổng 6543.
#   BACKUP_PASSPHRASE  mật khẩu mã hoá file sao lưu bằng gpg (bắt buộc: thiếu thì workflow dừng, không tải file thô lên).
# Giải mã: gpg --decrypt whosfree-xxx.dump.gpg > whosfree.dump  rồi  pg_restore --no-owner -d <DB_URL> whosfree.dump
# Lịch chỉ chạy trên nhánh mặc định (main). Chạy tay: tab Actions → DB backup → Run workflow.
name: DB backup

on:
  schedule:
    - cron: "15 20 * * *" # 03:15 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump database (PostgreSQL 17)
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$DB_URL" || { echo "::error::Thiếu secret SUPABASE_DB_URL"; exit 1; }
          test -n "$PASSPHRASE" || { echo "::error::Thiếu secret BACKUP_PASSPHRASE, không sao lưu khi chưa mã hoá được"; exit 1; }
          FILE="whosfree-$(date -u +%Y%m%d-%H%M).dump"
          docker run --rm -e DB_URL -v "$PWD:/out" postgres:17 \
            pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
              --schema=public --schema=auth \
              --exclude-table-data=auth.sessions --exclude-table-data=auth.refresh_tokens \
              --exclude-table-data=auth.one_time_tokens --exclude-table-data=auth.flow_state \
              --file="/out/$FILE"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          ls -lh "$FILE"

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 "$FILE" <<< "$PASSPHRASE"
          rm "$FILE"
          echo "FILE=$FILE.gpg" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error
