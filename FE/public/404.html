<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Who's Free</title>
    <script>
      // GitHub Pages SPA redirect trick
      // When GitHub Pages encounters a 404, this page takes the current URL path
      // and converts it into a query parameter, then redirects to index.html.
      // index.html will then restore the original path using the History API.
      var pathSegmentsToKeep = 1; // Keep '/Who-s-Free/' base segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
